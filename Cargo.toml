[package]
name = "lspdfr-mod-installer"
version = "0.3.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.24"
unrar = "0.5"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "lzma"] }

[profile.release]
strip = true
